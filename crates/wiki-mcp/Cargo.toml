[package]
name = "wiki-mcp"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "codebase-wiki-mcp"
path = "src/main.rs"

[features]
default = []
embed = ["rag-core/embed"]

[dependencies]
rag-core = { path = "../rag-core" }
rmcp = { version = "=3.9.0", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "io-std", "io-util"] }
