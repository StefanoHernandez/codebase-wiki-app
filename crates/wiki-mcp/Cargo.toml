[package]
name = "wiki-mcp"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "codebase-wiki-mcp"
path = "src/main.rs"

[features]
default = ["download"]
download = ["rag-core/download"]
embed = ["rag-core/embed", "download"]

[dependencies]
rag-core = { path = "../rag-core" }
wiki-core = { path = "../wiki-core" }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
rmcp = { version = "=3.9.0", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
