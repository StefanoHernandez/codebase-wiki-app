[package]
name = "rag-core"
version = "0.3.0"
edition = "2021"
rust-version.workspace = true

[features]
default = []
embed = ["dep:fastembed", "dep:ndarray", "dep:tokenizers", "text-splitter/tokenizers"]
download = ["dep:ureq"]

[dependencies]
wiki-core = { path = "../wiki-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.10.9"
dirs = "=6.0.0"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
sqlite-vec = "=0.1.6"
text-splitter = { version = "=0.33.2", features = ["code", "markdown"] }
tree-sitter = "=0.27.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-swift = "=0.7.4"
tree-sitter-php = "=0.25.1"
tree-sitter-ruby = "=0.23.1"
tree-sitter-bash = "=0.25.1"
tree-sitter-scala = "=0.26.11"
tree-sitter-lua = "=0.5.0"
ureq = { version = "=2.12.1", optional = true, default-features = false, features = ["tls"] }
toml_edit = "=0.22.24"
fastembed = { version = "=7.0.0", optional = true, default-features = false, features = [
    "ort-download-binaries-native-tls",
] }
ndarray = { version = "=0.17.2", optional = true }
# Same version fastembed uses: chunks are sized with the embedding model's own tokenizer.
tokenizers = { version = "=0.23.2", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "=3.23.0"
